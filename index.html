<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乐赏 · 倒计时</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0a12;
    --card: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.10);
    --text: #f4f5f8;
    --muted: #9aa0b5;
    --accent1: #7c5cff;
    --accent2: #3ea8ff;
    --accent3: #ff5ec8;
    --glow: rgba(124, 92, 255, 0.45);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* 背景光晕 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(42% 38% at 20% 18%, rgba(124,92,255,0.30), transparent 62%),
      radial-gradient(36% 40% at 82% 24%, rgba(62,168,255,0.20), transparent 62%),
      radial-gradient(46% 42% at 72% 86%, rgba(255,94,200,0.18), transparent 62%);
    z-index: -2;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 34px 34px;
    z-index: -1;
    opacity: 0.5;
    mask-image: radial-gradient(60% 60% at 50% 50%, #000, transparent);
  }

  .wrap {
    width: 100%;
    max-width: 640px;
    text-align: center;
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    font-size: 12px;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    color: var(--muted);
    margin-bottom: 26px;
  }

  .title {
    font-size: clamp(38px, 10vw, 64px);
    font-weight: 800;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    background: linear-gradient(100deg, #a98bff, var(--accent2) 55%, #ff7ad6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 15px;
    color: var(--muted);
    letter-spacing: 0.12em;
    margin-bottom: 46px;
  }

  .countdown {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(8px, 3vw, 22px);
    margin-bottom: 8px;
  }
  .unit { display: flex; flex-direction: column; align-items: center; }
  .card {
    min-width: clamp(66px, 18vw, 108px);
    padding: 20px 8px 16px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .number {
    font-size: clamp(40px, 11vw, 68px);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #ffffff, #b9c3ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .label {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.25em;
    text-indent: 0.25em;
  }
  .sep {
    font-size: clamp(28px, 7vw, 44px);
    font-weight: 300;
    color: var(--muted);
    opacity: 0.35;
    line-height: 1;
    user-select: none;
    padding-top: 16px;
  }

  .target {
    margin-top: 30px;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .meeting {
    margin: 34px auto 0;
    max-width: 420px;
    padding: 22px 24px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    text-align: left;
  }
  .meeting-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .meeting-head .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 10px #34d399;
  }
  .meeting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 15px;
  }
  .meeting-row .k { color: var(--muted); font-size: 13px; }
  .meeting-row .v {
    color: #e8ebff;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  .meeting-row .v:hover { color: var(--accent2); }
  .join {
    display: block;
    margin: 20px 0 0;
    padding: 14px;
    border-radius: 14px;
    text-align: center;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: #fff;
    background: linear-gradient(100deg, var(--accent1), var(--accent2));
    box-shadow: 0 10px 30px var(--glow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .join:hover { transform: translateY(-2px); box-shadow: 0 14px 40px var(--glow); }
  .join:active { transform: translateY(0); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%) translateY(20px);
    padding: 10px 20px;
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    font-size: 13px;
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 已开始状态 */
  .finished { display: none; }
  .finished-big {
    font-size: clamp(44px, 12vw, 72px);
    font-weight: 800;
    letter-spacing: 0.12em;
    background: linear-gradient(100deg, #34d399, var(--accent2), #ff7ad6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="badge">等待开启</div>
    <h1 class="title">乐赏</h1>
    <p class="subtitle">距离开始还有</p>

    <div id="countdown" class="countdown">
      <div class="unit">
        <div class="card"><div class="number" id="d">00</div><div class="label">天</div></div>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <div class="card"><div class="number" id="h">00</div><div class="label">时</div></div>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <div class="card"><div class="number" id="m">00</div><div class="label">分</div></div>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <div class="card"><div class="number" id="s">00</div><div class="label">秒</div></div>
      </div>
    </div>

    <p class="target" id="target"></p>

    <div class="meeting">
      <div class="meeting-head"><span class="dot"></span>腾讯会议 · 加入通道</div>
      <div class="meeting-row">
        <span class="k">会议号</span>
        <span class="v" id="meeting-id" title="点击复制">728-866-489</span>
      </div>
      <div class="meeting-row">
        <span class="k">会议密码</span>
        <span class="v" id="meeting-pw" title="点击复制">6767</span>
      </div>
      <a class="join" href="https://meeting.tencent.com/dm/cK93nPq2jMov" target="_blank" rel="noopener">一键入会 →</a>
    </div>

    <div class="finished" id="finished">
      <div class="finished-big">已开始</div>
      <p class="subtitle">点击上方按钮进入会议</p>
    </div>
  </main>

  <div class="toast" id="toast">已复制</div>

<script>
  // ===== 在这里修改目标时间（北京时间） =====
  var TARGET = new Date('2026-10-06T19:30:00+08:00').getTime();

  var dEl = document.getElementById('d');
  var hEl = document.getElementById('h');
  var mEl = document.getElementById('m');
  var sEl = document.getElementById('s');
  var targetEl = document.getElementById('target');
  var countdownEl = document.getElementById('countdown');
  var finishedEl = document.getElementById('finished');

  targetEl.textContent = '目标时间  ' + new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric',
    weekday: 'long', hour: '2-digit', minute: '2-digit', hour12: false
  }).format(TARGET) + '（北京时间）';

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    var remain = Math.max(0, TARGET - Date.now());
    var totalSec = Math.floor(remain / 1000);
    var days = Math.floor(totalSec / 86400);
    var hours = Math.floor((totalSec % 86400) / 3600);
    var minutes = Math.floor((totalSec % 3600) / 60);
    var seconds = totalSec % 60;

    dEl.textContent = pad(days);
    hEl.textContent = pad(hours);
    mEl.textContent = pad(minutes);
    sEl.textContent = pad(seconds);

    if (remain <= 0) {
      countdownEl.style.display = 'none';
      targetEl.style.display = 'none';
      finishedEl.style.display = 'block';
    }
  }

  tick();
  setInterval(tick, 1000);

  // ===== 点击复制会议号 / 密码 =====
  var toast = document.getElementById('toast');
  var toastTimer;
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }
  document.getElementById('meeting-id').addEventListener('click', function () {
    copyText('728-866-489');
  });
  document.getElementById('meeting-pw').addEventListener('click', function () {
    copyText('6767');
  });
</script>
</body>
</html>
